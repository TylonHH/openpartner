captainVersion: 4
services:
  $$cap_appname-db:
    image: postgres:16-alpine
    volumes:
      - $$cap_appname-db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: openpartner
      POSTGRES_PASSWORD: $$cap_postgres_password
      POSTGRES_DB: openpartner
    caproverExtra:
      notExposeAsWebApp: true

  $$cap_appname-api:
    image: ghcr.io/tylonhh/openpartner-api:latest
    depends_on:
      - $$cap_appname-db
    environment:
      NODE_ENV: production
      OPENPARTNER_MODE: selfhost
      OPENPARTNER_TENANCY: single
      DATABASE_URL: postgres://openpartner:$$cap_postgres_password@srv-captain--$$cap_appname-db:5432/openpartner
      API_PORT: '4601'
      ADMIN_API_KEY: $$cap_admin_api_key
      SECRETS_ENCRYPTION_KEY: $$cap_secrets_encryption_key
      PORTAL_URL: https://$$cap_portal_domain
      MAIL_FROM: $$cap_mail_from
      SMTP_HOST: smtp.resend.com
      SMTP_PORT: '465'
      SMTP_SECURE: '1'
      SMTP_USER: resend
      SMTP_PASSWORD: $$cap_resend_api_key
      METRICS_TOKEN: $$cap_metrics_token
    caproverExtra:
      containerHttpPort: '4601'

  $$cap_appname-router:
    image: ghcr.io/tylonhh/openpartner-router:latest
    depends_on:
      - $$cap_appname-db
    environment:
      NODE_ENV: production
      OPENPARTNER_MODE: selfhost
      OPENPARTNER_TENANCY: single
      DATABASE_URL: postgres://openpartner:$$cap_postgres_password@srv-captain--$$cap_appname-db:5432/openpartner
      ROUTER_PORT: '4701'
      COOKIE_DOMAIN: .$$cap_cookie_domain
      VELOCITY_MAX: '20'
      VELOCITY_WINDOW_MS: '60000'
    caproverExtra:
      containerHttpPort: '4701'

  $$cap_appname-portal:
    image: ghcr.io/tylonhh/openpartner-portal:latest
    depends_on:
      - $$cap_appname-api
    environment:
      API_UPSTREAM: srv-captain--$$cap_appname-api:4601
    caproverExtra:
      containerHttpPort: '8080'

caproverOneClickApp:
  variables:
    - id: $$cap_postgres_password
      label: PostgreSQL password
      defaultValue: $$cap_gen_random_hex(32)
      description: Auto-generated. Keep unchanged after the first deployment.
      validRegex: /^[0-9a-fA-F]{32}$/
    - id: $$cap_admin_api_key
      label: OpenPartner admin API key
      defaultValue: op_$$cap_gen_random_hex(48)
      description: Auto-generated bootstrap/emergency API key. Keep it private.
      validRegex: /^op_[0-9a-fA-F]{48}$/
    - id: $$cap_secrets_encryption_key
      label: Secrets encryption key
      defaultValue: $$cap_gen_random_hex(64)
      description: Auto-generated 32-byte key used to encrypt stored credentials. Never rotate casually after first use.
      validRegex: /^[0-9a-fA-F]{64}$/
    - id: $$cap_metrics_token
      label: Metrics token
      defaultValue: $$cap_gen_random_hex(32)
      description: Auto-generated bearer token protecting the metrics endpoint.
      validRegex: /^[0-9a-fA-F]{32}$/
    - id: $$cap_portal_domain
      label: Portal domain
      defaultValue: affiliate.hoerbuch.warsowerk.de
      description: Public domain for the OpenPartner portal.
      validRegex: /^.+\..+$/
    - id: $$cap_cookie_domain
      label: Cookie apex domain
      defaultValue: hoerbuch.warsowerk.de
      description: First-party attribution cookie scope. Do not include a leading dot here.
      validRegex: /^.+\..+$/
    - id: $$cap_resend_api_key
      label: Resend API key
      description: External credential from Resend. Use a key with sending permission. It becomes the SMTP password.
      validRegex: /^re_.+$/
    - id: $$cap_mail_from
      label: Sender address
      defaultValue: HörGeschenk <noreply@warsowerk.de>
      description: Must use a sender/domain that is verified in Resend.
      validRegex: /.+@.+\..+/
  instructions:
    start: >-
      Deploys OpenPartner as four CapRover apps: PostgreSQL, API, click router and partner portal.
      Internal passwords and encryption keys are generated automatically. For email you only need a Resend API key
      and a sender address on a domain verified in Resend.
    end: >-
      Assign $$cap_portal_domain to the portal app, affiliate-api.hoerbuch.warsowerk.de to the API app,
      and go.hoerbuch.warsowerk.de to the router app. Enable HTTPS and force HTTPS for all three public apps.
      Keep the database internal. OpenPartner sends transactional email only; it does not require an inbound mailbox.
  displayName: OpenPartner for HörGeschenk
  isOfficial: false
  description: Self-hosted OpenPartner affiliate stack for CapRover with PostgreSQL, automatic secrets and Resend SMTP.
  documentation: https://github.com/TylonHH/openpartner/blob/main/caprover/README.md
